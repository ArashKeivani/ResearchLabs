services:
  app:
    build:
      context: ./app
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    expose:
      - "3000"
    networks:
      - labnet
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  ssrf-target:
    build:
      context: ./internal-service
    expose:
      - "8081"
    networks:
      - labnet
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8081/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 2s

  cache:
    build:
      context: ./cache-proxy
    environment:
      ORIGIN_HOST: app
      ORIGIN_PORT: "3000"
      LISTEN_HOST: 0.0.0.0
      LISTEN_PORT: "8080"
      CACHE_TTL_SECONDS: "600"
    depends_on:
      app:
        condition: service_healthy
      ssrf-target:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:8080"
    networks:
      - labnet

networks:
  labnet:
    driver: bridge
    internal: true
