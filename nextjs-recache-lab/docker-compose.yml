services:
  app:
    build:
      context: ./app
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    expose:
      - "3000"
    # The app can reach the host's payload server through the dedicated bridge gateway.
    extra_hosts:
      - "host.docker.internal:${PAYLOAD_GATEWAY:-172.30.250.1}"
    networks:
      - labnet
      - payload-net
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  ssrf-target:
    build:
      context: ./internal-service
    expose:
      - "8081"
    networks:
      - labnet
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8081/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 2s

  cache:
    build:
      context: ./cache-proxy
    environment:
      ORIGIN_HOST: app
      ORIGIN_PORT: "3000"
      LISTEN_HOST: 0.0.0.0
      LISTEN_PORT: "8080"
      CACHE_TTL_SECONDS: "${CACHE_TTL_SECONDS:-600}"
    depends_on:
      app:
        condition: service_healthy
      ssrf-target:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:8080"
    networks:
      - labnet
      - cache-edge

networks:
  # App <-> cache <-> synthetic internal service. Containers on this network
  # have no external routing through this network.
  labnet:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: ${LAB_SUBNET:-172.29.250.0/24}
          gateway: ${LAB_GATEWAY:-172.29.250.1}

  # Dedicated internal bridge whose gateway is used by the host-side payload
  # server. The app resolves host.docker.internal to this gateway.
  payload-net:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: ${PAYLOAD_SUBNET:-172.30.250.0/24}
          gateway: ${PAYLOAD_GATEWAY:-172.30.250.1}

  # Separate bridge for the cache's host-published localhost endpoint.
  cache-edge:
    driver: bridge
